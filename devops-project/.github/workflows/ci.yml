# ci.yml — Pipeline CI/CD du projet
# Se déclenche à chaque push sur main et sur les pull requests vers main
#
# Étapes :
#                    ┌──▶ Test ─────────────┐
#   Lint ────────────┼──▶ Integration Test ─┼──▶ Build ──▶ Push (main uniquement)
#                    └──▶ AWS Test ─────────┘
#
# Les trois jobs du milieu tournent EN PARALLÈLE (ils dépendent tous les trois
# de `lint`, pas les uns des autres). Un pipeline, ce n'est pas forcément une
# ligne droite : tout ce qui est indépendant doit tourner en même temps,
# ça raccourcit le temps total.
#
# Test              → expliqué au Module 4 (CI/CD)
# Integration Test  → expliqué au Module 4 (CI/CD)
# AWS Test          → expliqué au Module 5 (AWS), car il a besoin de notions
#                     de cloud qu'on n'a pas encore vues au Module 4

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Étape 1 : Vérifier la qualité du code ---
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # Récupère le code du repo

      # Backend : lint avec Ruff (linter Python)
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
      - name: Lint backend (Ruff)
        run: |
          cd backend
          uv run ruff check .

      # Frontend : lint avec Oxlint (linter JS)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Lint frontend (Oxlint)
        run: |
          cd frontend
          bunx oxlint .

  # --- Étape 2 : Lancer les tests ---
  # needs: lint → ne tourne que si le lint passe (fail fast)
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Run tests
        run: |
          cd backend
          uv run pytest

  # --- Étape 2 bis : Les tests d'intégration (base de données) ---
  #
  # POURQUOI CE JOB EXISTE
  #
  # Le job `test` ci-dessus teste notre code TOUT SEUL : stockage en mémoire,
  # aucun service extérieur. C'est rapide, mais ça laisse un trou : le code qui
  # parle à PostgreSQL n'est jamais exécuté. La moitié de main.py n'est donc
  # couverte par aucun test.
  #
  # Ici on bouche ce trou en démarrant un VRAI PostgreSQL à côté du test.
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: lint

    # `services:` = des containers que GitHub démarre AVANT tes steps et qui
    # tournent à côté d'eux, joignables sur localhost. C'est l'équivalent d'un
    # docker-compose, mais géré par GitHub Actions.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        # Sans health-cmd, les steps démarreraient avant que PostgreSQL soit
        # prêt à répondre, et le test échouerait pour une mauvaise raison.
        options: >-
          --health-cmd "pg_isready -U user -d tasks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      # Les MÊMES tests que le job `test`, mais contre un vrai PostgreSQL.
      # Le code de l'application ne change pas : seule DATABASE_URL apparaît.
      # C'est tout l'intérêt de configurer par variables d'environnement.
      - name: Tests contre un vrai PostgreSQL
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/tasks
        run: |
          cd backend
          uv run pytest

  # --- Étape 2 ter : Les tests d'intégration AWS ---
  #
  # ⚠️ Ce job est expliqué au MODULE 5, pas au Module 4.
  # Il utilise un émulateur AWS local (Floci) pour tester le code qui parle à
  # S3 et SQS, sans compte AWS ni secret dans GitHub. Si tu lis ceci au
  # Module 4, tu peux ignorer ce job : tu y reviendras.
  aws-test:
    name: AWS Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      floci:
        image: floci/floci:1.7.0
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      # `-m integration` = lancer uniquement les tests portant cette étiquette
      # (par défaut ils sont exclus — voir backend/pyproject.toml).
      - name: Tests d'intégration AWS (Floci)
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          # Des identifiants factices : l'émulateur ne vérifie pas les
          # permissions. Aucun vrai secret AWS n'est nécessaire.
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          cd backend
          uv run pytest -m integration

  # --- Étape 3 : Construire les images Docker ---
  # needs: [...] → ne tourne que si TOUS les tests passent
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, integration-test, aws-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t devops-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t devops-frontend:${{ github.sha }} ./frontend

  # --- Étape 4 : Pousser les images sur Docker Hub ---
  # Ne tourne QUE sur la branche main (pas sur les pull requests)
  # needs: build → ne tourne que si le build réussit
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Se connecter à Docker Hub avec les secrets du repo
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:latest

      - name: Build and push frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:latest
